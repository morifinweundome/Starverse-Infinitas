<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starverse Infinitas</title>
<meta name="description" content="The Infinitas Galaxy: star map, standings, herald, archives and rules.">
<meta name="theme-color" content="#03050A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03050A;--line:#2C4A68;--line2:#1B2D44;--text:#D3DEEA;--bright:#E8F0F8;--chrome:#B9D3EA;--steel:#8FB3D4;--muted:#7F95AB;--gold:#F2C76B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03050A}}
:root[data-theme="dark"]{--bg:#03050A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.5 Lato,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none}
body[data-view=map] #bg{pointer-events:auto}
.layer{position:fixed;z-index:10;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s,transform .45s ease}
.layer.on{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s,transform .45s ease}
#shade{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .6s ease;opacity:0}
body[data-view=title] #shade{opacity:1;background:radial-gradient(ellipse at 50% 48%,rgba(3,5,10,.72),rgba(3,5,10,.6) 45%,rgba(3,5,10,.9) 80%)}
body[data-view=menu] #shade{opacity:1;background:linear-gradient(90deg,rgba(3,5,10,.94) 0%,rgba(3,5,10,.78) 34%,rgba(3,5,10,.15) 72%,rgba(3,5,10,0) 100%)}

/* title */
#title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#title img{width:min(560px,82vw);height:auto;filter:drop-shadow(0 0 30px rgba(143,179,212,.25))}
#title .tag{margin:0;color:var(--steel);letter-spacing:.32em;text-transform:uppercase;font-size:12px;font-weight:700}
#title .motto{margin:0;color:var(--muted);font-style:italic;max-width:440px}
#title .go{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.cta{border:1px solid var(--line);background:rgba(8,14,24,.75);padding:13px 26px;border-radius:999px;letter-spacing:.2em;text-transform:uppercase;font-size:12.5px;font-weight:900;color:var(--chrome);transition:border-color .2s,color .2s,box-shadow .2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cta:hover,.cta:focus-visible{border-color:var(--steel);color:var(--bright);box-shadow:0 0 24px rgba(143,179,212,.25);outline:none}
.cta.main{border-color:var(--steel);color:var(--bright)}
#title .note{font-size:12px;color:var(--muted);margin:0}

/* menu */
#menu{top:0;bottom:0;left:0;width:min(560px,100%);padding:clamp(28px,7vh,72px) clamp(24px,5vw,64px) 28px;display:flex;flex-direction:column;transform:translateX(-18px)}
#menu.on{transform:none}
#menu .mark{width:min(330px,70vw);height:auto;margin-bottom:6px}
#menu .tag{color:var(--steel);letter-spacing:.32em;text-transform:uppercase;font-size:11px;font-weight:700;margin:0 0 clamp(20px,5vh,48px)}
#menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(4px,1.2vh,12px)}
.item{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0 10px 18px;position:relative;transition:transform .25s ease}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:linear-gradient(var(--steel),transparent);opacity:0;transition:opacity .25s}
.item b{display:block;font-weight:900;font-size:clamp(20px,2.4vw,28px);letter-spacing:.14em;text-transform:uppercase;color:var(--chrome);line-height:1.15;transition:color .25s,text-shadow .25s}
.item span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.item:hover,.item:focus-visible{transform:translateX(8px);outline:none}
.item:hover::before,.item:focus-visible::before{opacity:1}
.item:hover b,.item:focus-visible b{color:var(--bright);text-shadow:0 0 22px rgba(143,179,212,.45)}
#menu .foot{margin-top:auto;padding-top:24px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
#menu .foot strong{color:var(--chrome);letter-spacing:.18em;text-transform:uppercase;font-size:11px}

/* panels */
#bar{top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 74px 0 12px;background:rgba(5,9,15,.96);border-bottom:1px solid var(--line2);z-index:20}
#bar .back{background:none;border:1px solid var(--line2);border-radius:999px;padding:6px 14px 6px 11px;color:var(--chrome);font-size:13px;letter-spacing:.06em}
#bar .back:hover{border-color:var(--steel);color:var(--bright)}
#bar h1{margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--steel);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#bar .own{color:var(--muted);font-size:12px;text-decoration:none;white-space:nowrap}
#bar .own:hover{color:var(--chrome)}
#panels{top:56px;left:0;right:0;bottom:0;background:var(--bg);transform:translateY(10px)}
#panels.on{transform:none}
#panels iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#panels iframe.cur{display:block}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:11px}
#panels.loading #load{display:flex}
body[data-view=title] .si-snd{display:none}
@media (max-width:760px){
  body[data-view=menu] #shade{background:linear-gradient(180deg,rgba(3,5,10,.9),rgba(3,5,10,.82) 60%,rgba(3,5,10,.6))}
  #menu{width:100%;padding:72px 22px 22px}
  #menu .mark{width:230px}
  .item{padding:8px 0 8px 14px}
  .item span{font-size:12.5px}
  #bar{padding-right:66px;gap:10px}
  #bar .own{display:none}
}
@media (max-height:620px){ .item span{display:none} }
@media (prefers-reduced-motion:reduce){ .layer,.item,#shade{transition:none} }
</style>
</head>
<body data-view="title">
<div id="shade"></div>

<section id="title" class="layer on" aria-label="Starverse Infinitas">
  <img src="assets/wordmark.png" alt="Starverse Infinitas" width="1000" height="235">
  <p class="tag">The Infinitas Galaxy</p>
  <p class="motto">Lore decides who you are; your choices decide what you become.</p>
  <div class="go">
    <button class="cta main" data-enter="sound">Enter with sound</button>
    <button class="cta" data-enter="silent">Enter in silence</button>
  </div>
  <p class="note">Sound can be changed at any time from the speaker in the corner.</p>
</section>

<nav id="menu" class="layer" aria-label="Main menu">
  <img class="mark" src="assets/wordmark.png" alt="Starverse Infinitas" width="1000" height="235">
  <p class="tag">The Infinitas Galaxy</p>
  <ul>
    <li><button class="item" data-go="map"><b>Star Map</b><span>Charted space, the hyperlanes and the spheres of the powers</span></button></li>
    <li><button class="item" data-go="standings"><b>Galactic Standings</b><span>The great powers ranked, treaties in force, the contracts board</span></button></li>
    <li><button class="item" data-go="herald"><b>Galactic Herald</b><span>News of the turn, the wars, the Galactic Timeline</span></button></li>
    <li><button class="item" data-go="archives"><b>Galactic Archives</b><span>Every civilization's lore, works and chronicle</span></button></li>
    <li><button class="item" data-go="rules"><b>Rules of Play</b><span>Everything a civilization can do, and what it costs</span></button></li>
  </ul>
  <div class="foot"><strong id="when">The galaxy awaits</strong><span>Orders close Sundays at 18:00, Singapore time</span></div>
</nav>

<header id="bar" class="layer">
  <button class="back" id="back" aria-label="Back to the main menu">‹ Menu</button>
  <h1 id="where"></h1>
  <a class="own" id="own" href="#" target="_blank" rel="noopener">Open in its own window ↗</a>
</header>
<main id="panels" class="layer"><div id="load">Opening…</div></main>

<script src="assets/sound.js"></script>
<script>
(function () {
  'use strict';
  var STANDINGS = '1tZyLl3OV1e-KIRukMT3QKZg-dm4MxNYzfA4-bwV0rPw';
  var FILES = { rules: 'rules.html', map: 'map.html', standings: 'standings.html', archives: 'archives.html', herald: 'herald.html' };
  var NAMES = { rules: 'Rules of Play', map: 'Star Map', standings: 'Galactic Standings', archives: 'Galactic Archives', herald: 'Galactic Herald' };
  var $ = function (s) { return document.querySelector(s); };
  var bg = document.createElement('iframe'), frames = {}, view = 'title', page = null, entered = false;

  /* window.SIShell must exist before the pages inside it load */
  window.SIShell = {
    go: function (p, inner) {
      if (p === 'menu' || !FILES[p]) { if (location.hash) history.pushState(null, '', location.pathname + location.search); entered = true; route(); return; }
      var h = '#' + p + (inner ? '/' + inner : '');
      if (location.hash !== h) location.hash = h; else route();
    },
    sync: function (p, inner) {
      if (p !== page || p === 'map') return;
      history.replaceState(null, '', '#' + p + (inner ? '/' + inner : ''));
      $('#own').href = FILES[p] + (inner ? '#' + inner : '');
    }
  };

  SISound.init({
    page: 'menu', buttons: true,
    fx: { hover: 'fx-hover.mp3', select: 'fx-select.mp3', button: 'fx-button.mp3' }, fxGain: { hover: 0.45 },
    css: '.si-snd{top:7px;right:14px;bottom:auto;z-index:30}.si-snd-b{width:42px;height:42px}.si-snd-p{top:52px;bottom:auto}@media (max-width:760px){.si-snd{top:7px;right:12px;bottom:auto}}',
    music: {
      calm: { lead: true, tracks: [['map-main-the-great-vastness.mp3', 'The Great Vastness'], ['map-1-hopes-and-dreams.mp3', 'Hopes and Dreams'], ['map-2-to-the-stars.mp3', 'To the Stars'], ['map-3-across-the-hyperlanes.mp3', 'Across the Hyperlanes'], ['map-4-plans-in-motion.mp3', 'Plans in Motion']] },
      crisis: { tracks: [['crisis-1-fog-of-war.mp3', 'Fog of War'], ['crisis-2-five-minutes.mp3', 'Five Minutes']] },
      war: { tracks: [['war-1-for-our-homeworld.mp3', 'For Our Homeworld'], ['war-2-here-we-stand.mp3', 'Here We Stand'], ['war-3-the-final-move.mp3', 'The Final Move'], ['war-4-honor-the-fallen.mp3', 'Honor the Fallen']] },
      archives: { tracks: [['archives-1-mystery-and-wonder.mp3', 'Mystery and Wonder'], ['archives-2-ancient-memory.mp3', 'Ancient Memory']] }
    }
  });

  /* ---------- views ---------- */
  function show(v) {
    view = v; document.body.dataset.view = v;
    $('#title').classList.toggle('on', v === 'title');
    $('#menu').classList.toggle('on', v === 'menu');
    $('#bar').classList.toggle('on', v === 'panel');
    $('#panels').classList.toggle('on', v === 'panel');
    if (v === 'menu' || v === 'title') { SISound.setScene(null); document.title = 'Starverse Infinitas'; }
    applyMap();
  }
  function applyMap() {
    var M; try { M = bg.contentWindow.SIMap; } catch (e) { M = null; }
    if (!M) return;
    M.backdrop(view !== 'map'); M.pause(view === 'panel');
  }
  bg.id = 'bg'; bg.title = 'The Infinitas Galaxy'; bg.tabIndex = -1; bg.setAttribute('aria-hidden', 'true');
  bg.addEventListener('load', applyMap);
  bg.src = 'map.html'; document.body.insertBefore(bg, document.body.firstChild);

  function parse() {
    var h = location.hash.slice(1); if (!h) return { p: null, i: '' };
    var k = h.indexOf('/'), head = k < 0 ? h : h.slice(0, k), rest = k < 0 ? '' : h.slice(k + 1);
    return FILES[head] ? { p: head, i: rest } : { p: 'rules', i: h };   // old links to a rule land on that rule
  }
  function route() {
    var r = parse();
    if (!r.p) { page = null; show(entered ? 'menu' : 'title'); if (entered) setTimeout(function () { var f = document.activeElement; if (!f || f === document.body) $('.item').focus({ preventScroll: true }); }, 60); return; }
    entered = true; open(r.p, r.i);
  }
  function open(p, inner) {
    page = p;
    SISound.setScene(p === 'archives' ? 'archives' : null);
    document.title = NAMES[p] + ' · Starverse Infinitas';
    if (p === 'map') { show('map'); return; }
    $('#where').textContent = NAMES[p];
    $('#own').href = FILES[p] + (inner ? '#' + inner : '');
    var f = frames[p], box = $('#panels');
    if (!f) {
      f = frames[p] = document.createElement('iframe');
      f.title = NAMES[p]; box.classList.add('loading');
      f.addEventListener('load', function () { if (page === p) box.classList.remove('loading'); });
      f.src = FILES[p] + (inner ? '#' + inner : '');
      box.appendChild(f);
    } else {
      box.classList.remove('loading');
      try { if (f.contentWindow.location.hash.slice(1) !== inner) f.contentWindow.location.replace(FILES[p] + '#' + inner); } catch (e) {}
    }
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('cur', k === p); });
    show('panel');
  }
  addEventListener('popstate', route);
  addEventListener('hashchange', route);

  /* ---------- controls ---------- */
  document.querySelectorAll('[data-enter]').forEach(function (b) {
    b.onclick = function () {
      var on = b.dataset.enter === 'sound';
      SISound.setPref({ music: on, fx: on });
      entered = true; route();
    };
  });
  document.querySelectorAll('.item').forEach(function (b) {
    b.onclick = function () { SISound.fx('select'); SIShell.go(b.dataset.go); };
    b.addEventListener('mouseenter', function () { SISound.fx('hover'); });
    b.addEventListener('focus', function () { if (b.matches(':focus-visible')) SISound.fx('hover'); });
  });
  $('#back').onclick = function () { SIShell.go('menu'); };
  addEventListener('keydown', function (e) {
    if (view === 'menu' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      var items = Array.prototype.slice.call(document.querySelectorAll('.item')), i = items.indexOf(document.activeElement);
      i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
      items[i].focus(); e.preventDefault();
    } else if (e.key === 'Escape' && view === 'panel' && !document.querySelector('.si-snd-p:not([hidden])')) SIShell.go('menu');
  });

  /* ---------- the galaxy's state: soundtrack mood and the date ---------- */
  function parseCSV(t) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function galaxy() {
    var base = 'https://docs.google.com/spreadsheets/d/' + STANDINGS + '/gviz/tq?tqx=out:csv&t=' + Date.now();
    Promise.all([
      fetch(base + '&headers=0&sheet=Setup&range=B4:B8').then(function (r) { return r.text(); }),
      fetch(base + '&headers=1&sheet=' + encodeURIComponent('Herald Feed') + '&range=V1:AF300').then(function (r) { return r.text(); })
    ]).then(function (res) {
      var s = parseCSV(res[0]).map(function (r) { return (r[0] || '').trim(); });
      var turn = Number(s[0]) || 0, per = Number(s[1]) || 5, first = Number(s[2]) || 1, era = s[3] || '', set = (s[4] || 'Auto').toLowerCase();
      var w = parseCSV(res[1]), h = w[0] || [], iS = h.indexOf('Status'), iW = h.indexOf('War ID');
      var atWar = iS >= 0 && w.slice(1).some(function (r) { return r[iW] && r[iS] === 'Ongoing'; });
      SISound.setMood(['calm', 'crisis', 'war'].indexOf(set) >= 0 ? set : atWar ? 'war' : 'calm');
      $('#when').textContent = turn > 0 ? 'Turn ' + turn + ' · Year ' + (first + (turn - 1) * per) + (era ? ' ' + era : '') : 'The galaxy awaits its first turn';
    }).catch(function () { SISound.setMood('calm'); });
  }
  galaxy(); setInterval(galaxy, 5 * 60 * 1000);

  /* a link straight to a section skips the title screen */
  if (parse().p) entered = true;
  route();
})();
</script>
</body>
</html>
